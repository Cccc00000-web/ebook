<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動電子繪本</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #f4efe6;
      color: #4a3e3d;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 15px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #3a2e2b;
    }

    /* 繪本主容器 */
    .storybook-container {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 800px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      perspective: 1000px; /* 建立 3D 空間感，讓翻頁立體 */
    }

    /* 圖片展示區 (加入 3D 轉換屬性) */
    .image-frame {
      width: 100%;
      max-height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fafafa;
      border-radius: 12px;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .image-frame img {
      width: 100%;
      height: auto;
      max-height: 500px;
      object-fit: contain;
    }

    /* 翻頁時的動畫樣式類別 */
    .page-flipping {
      transform: rotateY(90deg) scale(0.95);
      opacity: 0.2;
    }

    /* 控制列 */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 20px;
      gap: 15px;
    }

    /* 圖片箭頭按鈕樣式 */
    .arrow-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      transition: transform 0.1s, opacity 0.2s;
    }

    .arrow-btn img {
      width: 70px;
      height: auto;
      object-fit: contain;
    }

    .arrow-btn:hover {
      transform: scale(1.05);
    }

    .arrow-btn:active {
      transform: scale(0.95);
    }

    .arrow-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    .page-indicator {
      font-size: 1.1rem;
      font-weight: bold;
      color: #665c54;
    }

    /* 一般按鈕（語音與背景音樂） */
    button.audio-btn {
      background-color: #7b6d5b;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.audio-btn:hover {
      background-color: #5c5042;
    }

    /* 音訊控制項 */
    .audio-controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>電子繪本閱讀器</h1>
  </header>

  <main class="storybook-container">
    <!-- 繪本圖片 -->
    <div class="image-frame" id="image-frame">
      <img id="page-img" src="assets/graphics/0.jpg" alt="繪本頁面">
    </div>

    <!-- 頁碼與圖片箭頭翻頁按鈕 -->
    <div class="controls">
      <button id="prev-btn" class="arrow-btn" onclick="changePage(-1)" disabled>
        <img src="assets/graphics/left.jpg" alt="上一頁">
      </button>

      <span class="page-indicator" id="page-num">第 0 / 19 頁</span>

      <button id="next-btn" class="arrow-btn" onclick="changePage(1)">
        <img src="assets/graphics/right.jpg" alt="下一頁">
      </button>
    </div>

    <!-- 音效與背景音樂控制 -->
    <div class="audio-controls">
      <button class="audio-btn" onclick="playSpeech()">🔊 重播朗讀</button>
      <button class="audio-btn" id="bgm-btn" onclick="toggleBGM()">🎵 背景音樂：開啟</button>
    </div>
  </main>

  <!-- 音訊元件 -->
  <audio id="speech-audio"></audio>
  <audio id="bgm-audio" loop></audio>

  <script>
    const totalPages = 19;
    let currentPage = 0;
    let isBgmEnabled = true;

    const imageFrame = document.getElementById('image-frame');
    const pageImg = document.getElementById('page-img');
    const pageNum = document.getElementById('page-num');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const speechAudio = document.getElementById('speech-audio');
    const bgmAudio = document.getElementById('bgm-audio');
    const bgmBtn = document.getElementById('bgm-btn');

    loadPageMedia();

    function changePage(direction) {
      // 觸發翻頁 3D 動態特效
      imageFrame.classList.add('page-flipping');

      setTimeout(() => {
        currentPage += direction;

        if (currentPage < 0) currentPage = 0;
        if (currentPage > totalPages) currentPage = totalPages;

        // 切換圖片與頁碼
        pageImg.src = `assets/graphics/${currentPage}.jpg`;
        pageNum.innerText = `第 ${currentPage} / ${totalPages} 頁`;

        prevBtn.disabled = (currentPage === 0);
        nextBtn.disabled = (currentPage === totalPages);

        loadPageMedia();

        // 移除特效類別，讓圖片轉回正面
        imageFrame.classList.remove('page-flipping');
      }, 250); // 配合 0.25 秒的過場時間
    }

    function loadPageMedia() {
      speechAudio.src = `assets/speech/speech${currentPage}.mp3`;
      speechAudio.play().catch(() => {});

      bgmAudio.src = `assets/music/music${currentPage}.mp3`;
      if (isBgmEnabled) {
        bgmAudio.play().catch(() => {});
      }
    }

    function playSpeech() {
      speechAudio.currentTime = 0;
      speechAudio.play();
    }

    function toggleBGM() {
      isBgmEnabled = !isBgmEnabled;
      if (isBgmEnabled) {
        bgmAudio.play();
        bgmBtn.innerText = "🎵 背景音樂：開啟";
      } else {
        bgmAudio.pause();
        bgmBtn.innerText = "🎵 背景音樂：關閉";
      }
    }
  </script>
</body>
</html>
